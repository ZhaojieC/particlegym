[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "particlegym"
dynamic = ["version", "readme"]
description = "Fast, physically validated 2D/3D particle-dynamics environments for reinforcement learning"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Zhaojie Chai" }]
keywords = [
  "reinforcement learning",
  "particle dynamics",
  "social force model",
  "active matter",
  "crowd simulation",
  "jax",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["jax>=0.4.30", "numpy>=1.26"]

[project.optional-dependencies]
viz = ["pillow>=10"]
gymnasium = ["gymnasium>=1.0"]
pettingzoo = ["pettingzoo>=1.24", "gymnasium>=1.0"]
test = ["particlegym[viz,gymnasium,pettingzoo]", "pytest>=8"]
docs = ["mkdocs-material>=9.5"]
dev = ["particlegym[test,docs]", "ruff>=0.6", "pre-commit>=3"]

[tool.hatch.version]
path = "src/particlegym/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/particlegym"]

# The animations stay in the repository; the source distribution does not carry them.
[tool.hatch.build.targets.sdist]
exclude = ["/docs/assets", "/.github"]

# The README of the package index needs absolute addresses for pictures and links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="docs/'
replacement = 'src="https://raw.githubusercontent.com/ZhaojieC/particlegym/main/docs/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:docs|examples)(?:/[^)]*)?|[A-Z_]+(?:\.md)?)\)'
replacement = '](https://github.com/ZhaojieC/particlegym/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running statistical validation tests"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM", "RUF"]
